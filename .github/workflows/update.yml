name: Deploy OTA Update to Expo

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Expo OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI manually
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Publish Update
        env:
          EXPO_TOKEN: ${{qMq-ZBP-FUu1f_XkSiLscNix9mpJrbhCAkr9WOf5}}
        run: eas update --branch production --message "تحديث تلقائي أونلاين من GitHub Actions"
