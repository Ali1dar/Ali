name: Deploy OTA Update to Expo

on:
  push:
    branches:
      - main  # ⚠️ تأكد إذا كان اسم الفرع الرئيسي عندك main أو master وقمه بتعديله إذا لزم الأمر

jobs:
  update:
    name: Expo OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish Update
        run: eas update --branch production --message "تحديث تلقائي أونلاين من GitHub Actions"
